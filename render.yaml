services:
  # Unified Fullstack Service (FastAPI + React Frontend)
  - type: web
    name: paarakhmetric-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: cd ../frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
